name: CI
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: river
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: river_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U river -d river_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      JIRA_MODE: mock
      DATABASE_URL: postgresql+psycopg://river:test-only-password@localhost:5432/river_test
      TEST_DATABASE_URL: postgresql+psycopg://river:test-only-password@localhost:5432/river_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run migration
        working-directory: backend
        run: alembic upgrade head
      - name: Backend tests including PostgreSQL concurrency
        working-directory: backend
        run: python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Type check
        working-directory: frontend
        run: npm run typecheck
      - name: Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build
